name: Compilar SURVIVALCRAFT64

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/dragonminded/libdragon:latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar archivos
        run: |
          apt-get update
          apt-get install -y unzip

      - name: Extraer el juego
        run: |
          unzip -o SURVIVALCRAFT64_Beta02_Codigo.zip -d project

      - name: Instalar libdragon
        run: |
          git clone --depth 1 https://github.com/DragonMinded/libdragon.git /tmp/libdragon
          cd /tmp/libdragon
          make install
          make tools-install

      - name: Compilar el juego
        run: |
          cd project/SURVIVALCRAFT64_Beta02
          make

      - name: Comprobar ROM
        run: |
          find project -type f -name '*.z64' -print

      - name: Guardar ROM
        uses: actions/upload-artifact@v4
        with:
          name: SURVIVALCRAFT64-ROM
          path: project/**/*.z64
          if-no-files-found: error
